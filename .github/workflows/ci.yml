name: Validate showcase
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build server/AccountingLeads.slnx --configuration Release
      - run: dotnet test server/tests/AccountingLeads.UnitTests/AccountingLeads.UnitTests.csproj --configuration Release --no-build
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/accounting-leads-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/accounting-leads-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
